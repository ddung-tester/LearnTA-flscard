<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <!-- Cài lên màn hình chính như app (Chrome/Samsung Internet → "Thêm vào màn hình chính"); app mở web nên push là tự cập nhật -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7d492" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="referrer" content="same-origin" />
    <meta name="description" content="Streak Drop — Học từ vựng tiếng Anh hiệu quả với flashcard, quiz và phần thưởng Streak Drop." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap&amp;subset=vietnamese" />
    <title>Streak Drop — Học từ vựng tiếng Anh</title>
    <script>
      // Đặt giao diện đèn bàn trước khi vẽ để không nháy nền sáng (xem utils/giaoDien.js)
      try {
        var g = localStorage.getItem("learnta_giao_dien");
        if (!g) g = matchMedia("(prefers-color-scheme: dark)").matches ? "den-ban" : "sang";
        if (g === "den-ban" && location.pathname !== "/") document.documentElement.dataset.giaoDien = "den-ban";
      } catch (e) {}
      // Máy yếu (≤4 luồng CPU, ≤4GB RAM hoặc bật tiết kiệm dữ liệu): tắt hiệu ứng nặng (xem utils/mayYeu.js)
      try {
        var n = navigator;
        if ((n.connection && n.connection.saveData) || (n.hardwareConcurrency && n.hardwareConcurrency <= 4) || (n.deviceMemory && n.deviceMemory <= 4))
          document.documentElement.classList.add("may-yeu");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
